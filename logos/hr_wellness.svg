<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <rect width="100%" height="100%" fill="none"/>
  <!-- HR Monogram & Lotus Motif -->
  <g transform="translate(15, 10)">
    <circle cx="45" cy="45" r="36" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <!-- Intertwined HR Letters -->
    <text x="26" y="55" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#15803d" letter-spacing="-1">H</text>
    <text x="46" y="55" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#b45309" letter-spacing="-1">R</text>
    <!-- Lotus petal overlay -->
    <path d="M45 20 C35 32, 35 42, 45 46 C55 42, 55 32, 45 20 Z" fill="#22c55e" opacity="0.6"/>
  </g>
  <text x="110" y="52" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#14532d" letter-spacing="1">HR WELLNESS</text>
  <text x="110" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#b45309" letter-spacing="3">SPA &amp; SALON</text>
</svg>